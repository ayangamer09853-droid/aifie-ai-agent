[build]
  command = "echo 'No build needed'"
  publish = "public"
  functions = "netlify/functions"

[dev]
  command = "node server.mjs"
  port = 8787

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
